name: CI/CD Pipeline - Quality & Security

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Droits minimaux par défaut : le code n'a besoin que de lire le dépôt.
permissions:
  contents: read

# Un nouveau push annule le run précédent de la même branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # JOB 1 : Lint et format (indépendant de la version de Python)
  # ---------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          # Version figée : les règles de formatage changent d'une version à l'autre.
          pip install "ruff==0.17.1"

      - name: Ruff linter
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  # ---------------------------------------------------------
  # JOB 2 : Sécurité (SAST + dépendances + secrets), exécutée UNE fois
  # ---------------------------------------------------------
  security:
    name: Security (SAST, dependencies, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks scanne tout l'historique des commits

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit report (medium and above, informational)
        run: |
          echo "🛡️ Bandit report (severity >= MEDIUM, confidence >= MEDIUM)..."
          # -ll : sévérité MEDIUM et plus ; -ii : confiance MEDIUM et plus.
          # Rapport complet, ne bloque pas. tests/ est exclu (chemins /tmp factices).
          bandit -r . -ll -ii -x ./tests,./.venv -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Bandit gate (HIGH severity only)
        run: |
          # -lll : sévérité HIGH uniquement ; -ii : confiance MEDIUM et plus.
          # Cette étape fait échouer le build.
          bandit -r . -lll -ii -x ./tests,./.venv

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
          if-no-files-found: ignore

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          echo "📦 Auditing requirements.txt..."
          pip-audit -r requirements.txt
          echo "📦 Auditing requirements-dev.txt..."
          pip-audit -r requirements-dev.txt

      - name: Run Gitleaks (secrets detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------------------------------------------------------
  # JOB 3 : Tests sur chaque version de Python supportée
  # ---------------------------------------------------------
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest pytest-cov

      - name: Run Pytest with coverage
        run: |
          echo "🧪 Running tests..."
          pytest tests/ -v \
            --cov=agentguard \
            --cov=collector \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to Codecov (optional)
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false # un échec d'upload ne doit pas casser le CI
          token: ${{ secrets.CODECOV_TOKEN }}
