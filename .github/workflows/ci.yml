name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest

  rust:
    name: Rust trace engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/trace-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/trace-engine
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Run on the example trace
        run: cargo run -- ../../example-trace.jsonl
