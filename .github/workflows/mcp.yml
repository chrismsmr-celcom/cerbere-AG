# CI du package MCP (serveur consultatif + gateway universelle)
# - à chaque push/PR : tests gateway (core, smoke, enforcement, whitelist)
# - à chaque tag v* : build sdist/wheel + publication PyPI
#   (secrets requis : PYPI_API_TOKEN / TWINE_USERNAME + TWINE_PASSWORD,
#    ou Trusted Publishing si PyPI est configuré pour ce repo)

name: mcp

on:
  push:
    branches: [main]
    paths: ["mcp/**", "tests/test_gateway*.py", "tests/test_mcp_gateway*.py", ".github/workflows/mcp.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["mcp/**", "tests/test_gateway*.py", "tests/test_mcp_gateway*.py", ".github/workflows/mcp.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install "./mcp[gateway-http,yaml,dev]"

      - name: Gateway unit tests
        run: |
          pytest tests/test_gateway_core.py tests/test_gateway_smoke.py \
                 tests/test_mcp_gateway_enforcement.py \
                 tests/test_mcp_gateway_whitelist.py -v

      - name: Smoke stdio (config inline, fail-closed attendu sans amont)
        run: |
          set +e
          echo '{"transport":"stdio","servers":[]}' > /tmp/empty.json
          cerbere-ag-gateway --config /tmp/empty.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit code 2 (ConfigError), got $code"; exit 1
          fi

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build mcp/
          twine check mcp/dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload mcp/dist/*
