name: Supply chain (image scan + SBOM)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "0 5 * * 1"   # chaque lundi : de nouvelles CVE apparaissent sans nouveau commit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-scan:
    name: Trivy (Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write   # upload SARIF dans l'onglet Security
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cerbere:scan .

      # Rapport complet (HIGH + CRITICAL), non bloquant : visible dans l'onglet Security.
      - name: Trivy report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@v0.27.0  # ✅ Version corrigée
        with:
          image-ref: cerbere:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Garde-fou : bloque uniquement les CRITICAL pour lesquelles un correctif existe.
      - name: Trivy gate (fixable CRITICAL only)
        uses: aquasecurity/trivy-action@v0.27.0  # ✅ CORRIGÉ : v0.27.0 au lieu de 0.27.0
        with:
          image-ref: cerbere:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json