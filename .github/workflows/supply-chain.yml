
name: Supply chain (image scan + SBOM)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-scan:
    name: Trivy (Docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cerbere:scan .

      # Generate a complete HIGH and CRITICAL vulnerability report.
      - name: Trivy report (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@v0.27.0
        with:
          image-ref: cerbere:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      # Upload vulnerability report to GitHub Security.
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Block the pipeline only for fixable CRITICAL vulnerabilities.
      - name: Trivy gate (fixable CRITICAL only)
        uses: aquasecurity/trivy-action@v0.27.0
        with:
          image-ref: cerbere:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CycloneDX
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom

      - name: Generate SBOM
        run: |
          cyclonedx-py requirements requirements.txt --of JSON -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
