[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-ag-mcp"
version = "0.2.0"
description = "CerbereAG MCP security tools and universal MCP gateway."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Christopher Dikesa" }]
keywords = ["ai", "agents", "security", "mcp", "model-context-protocol", "guardrails", "gateway"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "cerbere-ag>=0.2.0",
  "mcp>=1.28,<2.0.0",
  "tiktoken>=0.7.0,<1.0.0",
  "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
gateway-http = [
  "uvicorn>=0.30.0",
  "starlette>=0.37.0",
]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0"]

[project.scripts]
cerbere-ag-mcp = "mcp_server:main"
cerbere-ag-gateway = "gateway_server:main"

[project.urls]
Homepage = "https://app.cerbereag.site"
Repository = "https://github.com/chrismsmr-celcom/cerbere-AG"

[tool.setuptools]
py-modules = ["mcp_server", "chatgpt_server", "gateway_server", "gateway_config", "gateway_inspection"]
