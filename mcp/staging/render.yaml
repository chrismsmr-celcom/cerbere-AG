# Dedicated audit-only stack. This file is intentionally separate from
# the production root render.yaml and is applied only after explicit approval.
projects:
  - name: cerbere-ag-security-audit
    environments:
      - name: staging
        envVarGroups:
          - name: cerbere-audit-shared
            envVars:
              - key: AGENTGUARD_API_KEY
                generateValue: true
        databases:
          - name: cerbere-audit-db
            databaseName: cerbere_audit
            user: cerbere_audit
            plan: free
            region: oregon
        services:
          - type: pserv
            name: cerbere-audit-collector
            runtime: python
            plan: starter
            region: oregon
            buildCommand: pip install -r requirements.txt
            startCommand: gunicorn "collector.app:create_app()" --workers 1 --threads 4 --worker-class gthread --timeout 120 --bind 0.0.0.0:$PORT
            autoDeployTrigger: off
            envVarGroups:
              - cerbere-audit-shared
            envVars:
              - key: WEB_CONCURRENCY
                value: "1"
              - key: ENVIRONMENT
                value: staging
              - key: AGENTGUARD_ENVIRONMENT
                value: staging
              - key: AGENTGUARD_DB_TYPE
                value: postgres
              - key: DATABASE_URL
                fromDatabase:
                  name: cerbere-audit-db
                  property: connectionString
              - key: AGENTGUARD_ADMIN_SECRET
                generateValue: true
              - key: AGENTGUARD_FLASK_SECRET
                generateValue: true
              - key: AGENTGUARD_CORS_ORIGINS
                value: https://app.cerbereag.site
          - type: web
            name: cerbere-audit-mcp-gateway
            runtime: python
            plan: free
            region: oregon
            buildCommand: pip install -e "./mcp[gateway-http]"
            startCommand: python mcp/staging/start_gateway.py
            autoDeployTrigger: off
            envVarGroups:
              - cerbere-audit-shared
            envVars:
              - key: AGENTGUARD_COLLECTOR_HOSTPORT
                fromService:
                  type: pserv
                  name: cerbere-audit-collector
                  property: hostport
