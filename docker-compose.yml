services:
  collector:
    build:
      context: .
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
        PRELOAD_MODEL: ${PRELOAD_MODEL:-false}
    image: agentguard:latest
    container_name: agentguard-collector
    ports:
      - "8080:8080"
    environment:
      # ── CORE ──────────────────────────────────────────────────
      PORT: 8080
      AGENTGUARD_DB_TYPE: ${AGENTGUARD_DB_TYPE:-postgres}
      AGENTGUARD_ENVIRONMENT: ${AGENTGUARD_ENVIRONMENT:-production}
      # Réseau Docker interne : TLS Postgres désactivé par défaut.
      # Pour l'activer : docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
      DATABASE_URL: postgresql://agentguard:${POSTGRES_PASSWORD:?run ./scripts/selfhost-init.sh to create .env}@postgres:5432/agentguard?sslmode=${DB_SSL_MODE:-disable}
      AGENTGUARD_API_KEY: ${AGENTGUARD_API_KEY:?run ./scripts/selfhost-init.sh to create .env}
      AGENTGUARD_ADMIN_SECRET: ${AGENTGUARD_ADMIN_SECRET:?run ./scripts/selfhost-init.sh to create .env}
      AGENTGUARD_FLASK_SECRET: ${AGENTGUARD_FLASK_SECRET:?run ./scripts/selfhost-init.sh to create .env}

      # ── ACCÈS ─────────────────────────────────────────────────
      # Connexion par mot de passe (sans SMTP ni Supabase). Premier admin :
      #   docker compose exec collector python -m collector.cli create-admin --email ...
      AGENTGUARD_PASSWORD_LOGIN_ENABLED: ${AGENTGUARD_PASSWORD_LOGIN_ENABLED:-true}
      # Lien magique par email : nécessite AGENTGUARD_SMTP_HOST. Désactivé par défaut.
      AGENTGUARD_MAGIC_LINK_ENABLED: ${AGENTGUARD_MAGIC_LINK_ENABLED:-false}

      # ── SSO D'ENTREPRISE (OIDC, optionnel) ────────────────────
      # Okta, Entra ID, Google Workspace, Keycloak, Auth0... Voir docs/SELF_HOSTING.md
      AGENTGUARD_OIDC_ISSUER: ${AGENTGUARD_OIDC_ISSUER:-}
      AGENTGUARD_OIDC_CLIENT_ID: ${AGENTGUARD_OIDC_CLIENT_ID:-}
      AGENTGUARD_OIDC_CLIENT_SECRET: ${AGENTGUARD_OIDC_CLIENT_SECRET:-}
      AGENTGUARD_OIDC_ALLOWED_DOMAINS: ${AGENTGUARD_OIDC_ALLOWED_DOMAINS:-}
      AGENTGUARD_OIDC_SCOPES: ${AGENTGUARD_OIDC_SCOPES:-openid email profile}
      AGENTGUARD_OIDC_DEFAULT_ROLE: ${AGENTGUARD_OIDC_DEFAULT_ROLE:-viewer}
      AGENTGUARD_OIDC_GROUPS_CLAIM: ${AGENTGUARD_OIDC_GROUPS_CLAIM:-groups}
      AGENTGUARD_OIDC_GROUP_ROLE_MAP: ${AGENTGUARD_OIDC_GROUP_ROLE_MAP:-}
      AGENTGUARD_OIDC_REQUIRE_EMAIL_VERIFIED: ${AGENTGUARD_OIDC_REQUIRE_EMAIL_VERIFIED:-true}
      AGENTGUARD_OIDC_ORG_ID: ${AGENTGUARD_OIDC_ORG_ID:-}
      AGENTGUARD_OIDC_BUTTON_LABEL: ${AGENTGUARD_OIDC_BUTTON_LABEL:-company SSO}
      # /signup crée un workspace admin pour n'importe quel visiteur :
      # désactivé par défaut en self-hosted.
      AGENTGUARD_SIGNUP_ENABLED: ${AGENTGUARD_SIGNUP_ENABLED:-false}
      # Cookie de session "Secure" : mettre true dès que l'accès se fait en HTTPS
      # (reverse proxy). false permet d'évaluer en http://localhost ou sur un LAN.
      AGENTGUARD_COOKIE_SECURE: ${AGENTGUARD_COOKIE_SECURE:-false}
      # Nombre de reverse proxies de confiance devant Cerbere (1 si Caddy/nginx/Traefik) :
      # sans cela, le limiteur de débit voit l'IP du proxy pour tous les clients.
      AGENTGUARD_TRUSTED_PROXIES: ${AGENTGUARD_TRUSTED_PROXIES:-0}

      # ── SECURITY ──────────────────────────────────────────────
      AGENTGUARD_MAX_BODY_BYTES: ${AGENTGUARD_MAX_BODY_BYTES:-262144}
      AGENTGUARD_AUTH_SESSION_TTL: ${AGENTGUARD_AUTH_SESSION_TTL:-900}
      AGENTGUARD_CORS_ORIGINS: ${AGENTGUARD_CORS_ORIGINS:-http://localhost:8080}
      AGENTGUARD_RATE_LIMIT: ${AGENTGUARD_RATE_LIMIT:-120 per minute}
      AGENTGUARD_SPAN_RATE_LIMIT: ${AGENTGUARD_SPAN_RATE_LIMIT:-30 per minute}
      AGENTGUARD_LIMITER_STORAGE: redis://redis:6379/0

      # ── DETECTION ─────────────────────────────────────────────
      AGENTGUARD_USE_ML: ${AGENTGUARD_USE_ML:-false}
      AGENTGUARD_ML_THRESHOLD: ${AGENTGUARD_ML_THRESHOLD:-0.85}
      AGENTGUARD_MODEL_PATH: ${AGENTGUARD_MODEL_PATH:-/app/models/prompt-injection}
      AGENTGUARD_USE_LLM_JUDGE: ${AGENTGUARD_USE_LLM_JUDGE:-false}
      AGENTGUARD_JUDGE_API_KEY: ${AGENTGUARD_JUDGE_API_KEY:-}
      AGENTGUARD_JUDGE_URL: ${AGENTGUARD_JUDGE_URL:-https://api.deepseek.com/chat/completions}
      AGENTGUARD_JUDGE_MODEL: ${AGENTGUARD_JUDGE_MODEL:-deepseek-chat}
      AGENTGUARD_JUDGE_TIMEOUT: ${AGENTGUARD_JUDGE_TIMEOUT:-15.0}
      AGENTGUARD_JUDGE_CACHE_SIZE: ${AGENTGUARD_JUDGE_CACHE_SIZE:-2048}
      AGENTGUARD_BLOCK_ON_AMBIGUOUS: ${AGENTGUARD_BLOCK_ON_AMBIGUOUS:-false}
      AGENTGUARD_DETECTOR_FAILURE_MODE: ${AGENTGUARD_DETECTOR_FAILURE_MODE:-fail_closed}

      # ── PERFORMANCE ───────────────────────────────────────────
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      AGENTGUARD_MAX_PENDING: ${AGENTGUARD_MAX_PENDING:-500}
      AGENTGUARD_COLLECTOR_TIMEOUT: ${AGENTGUARD_COLLECTOR_TIMEOUT:-5.0}

      # ── LOGGING ───────────────────────────────────────────────
      AGENTGUARD_LOG_LEVEL: ${AGENTGUARD_LOG_LEVEL:-INFO}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-agentguard}

      # ── ALERTING (optionnel) ──────────────────────────────────
      AGENTGUARD_ALERT_SLACK_WEBHOOK: ${AGENTGUARD_ALERT_SLACK_WEBHOOK:-}
      AGENTGUARD_ALERT_WEBHOOK_URL: ${AGENTGUARD_ALERT_WEBHOOK_URL:-}
      AGENTGUARD_ALERT_EMAIL_TO: ${AGENTGUARD_ALERT_EMAIL_TO:-}
      AGENTGUARD_SMTP_HOST: ${AGENTGUARD_SMTP_HOST:-}
      AGENTGUARD_SMTP_PORT: ${AGENTGUARD_SMTP_PORT:-587}
      AGENTGUARD_SMTP_USER: ${AGENTGUARD_SMTP_USER:-}
      AGENTGUARD_SMTP_PASS: ${AGENTGUARD_SMTP_PASS:-}
      AGENTGUARD_ALERT_MIN_RISK: ${AGENTGUARD_ALERT_MIN_RISK:-high}
      AGENTGUARD_ALERT_COOLDOWN: ${AGENTGUARD_ALERT_COOLDOWN:-300}
      AGENTGUARD_PUBLIC_URL: ${AGENTGUARD_PUBLIC_URL:-http://localhost:8080}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    volumes:
      - agentguard_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - agentguard_network

  postgres:
    image: postgres:16-alpine
    container_name: agentguard-postgres
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./scripts/selfhost-init.sh to create .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - agentguard_network

  redis:
    image: redis:7-alpine
    container_name: agentguard-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - agentguard_network

volumes:
  agentguard_data:
  postgres_data:
  redis_data:

networks:
  agentguard_network:
    driver: bridge