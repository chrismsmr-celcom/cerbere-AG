[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-ag"
version = "0.6.1"
description = "Runtime security & observability guard for AI agents — intercepts LLM calls and tool calls before execution."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Note: setuptools détecte automatiquement les fichiers "LICENSE". 
# Vous pouvez garder cette ligne, mais assurez-vous que votre fichier s'appelle bien exactement "LICENSE" (et non LICENSE.txt).
license-files = ["LICENSE"] 
authors = [
    { name = "Christopher Dikesa" }
]
keywords = ["ai", "agents", "security", "llm", "guardrails", "observability", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    # SUPPRIMÉ : "License :: OSI Approved :: Apache Software License" (Conflit PEP 639)
]
dependencies = [
    "requests>=2.31.0,<3.0.0",
    "structlog>=23.2.0,<25.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
signing = ["cryptography>=41.0.0,<45.0.0"]
pii = ["presidio-analyzer>=2.2.350,<3.0.0", "presidio-anonymizer>=2.2.350,<3.0.0"]
redis = ["redis>=5.0.0,<6.0.0"]
ml = ["torch==2.1.2", "transformers==4.36.2", "scikit-learn==1.3.2"]

[project.urls]
Homepage = "https://app.cerbereag.site"
Repository = "https://github.com/chrismsmr-celcom/cerbere-AG"

