[build-system]
# setuptools>=77 est requis pour la licence SPDX (PEP 639) :
# license = "Apache-2.0" et license-files échouent avec setuptools 68.
# "wheel" n'est plus nécessaire : setuptools le fournit depuis la v70.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cerbere-ag"
version = "0.6.2"
description = "Runtime security & observability guard for AI agents — intercepts LLM calls and tool calls before execution."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Le fichier doit s'appeler exactement "LICENSE" (et non LICENSE.txt).
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Dikesa" }
]
keywords = ["ai", "agents", "security", "llm", "guardrails", "observability", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    # Pas de classifier "License :: ..." (conflit PEP 639)
]

dependencies = [
    "requests>=2.31.0,<3.0.0",
    "structlog>=23.2.0,<25.0.0",
    "tiktoken>=0.7.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",
]

[project.optional-dependencies]
signing = ["cryptography>=41.0.0,<45.0.0"]
pii = ["presidio-analyzer>=2.2.350,<3.0.0", "presidio-anonymizer>=2.2.350,<3.0.0"]
redis = ["redis>=5.0.0,<6.0.0"]
# torch/transformers épinglements de 2023 avec CVE connues :
# garder des bornes serrées pour reproductibilité, mais sur des versions soutenues.
ml = [
    "torch>=2.2.0,<2.6.0",
    "transformers>=4.40.0,<5.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
]
# Dépendances des scripts d'évaluation (scripts/evaluate_detection.py)
eval = ["datasets>=2.18.0,<4.0.0", "scikit-learn>=1.4.0,<2.0.0"]

[project.urls]
Homepage = "https://app.cerbereag.site"
Repository = "https://github.com/chrismsmr-celcom/cerbere-AG"

[tool.setuptools.packages.find]
# ⚠️ CORRECTIF MAJEUR : ne packager QUE les composants Apache 2.0.
# - "collector*" est sous licence COMMERCIALE : ne doit jamais figurer
#   dans le wheel PyPI (conflit de licence avec license = "Apache-2.0").
# - "mcp*" est publié séparément comme "cerbere-ag-mcp" (mcp/pyproject.toml) :
#   l'inclure ici créerait deux distributions du même code.
# - "tools*" : scripts de dev/dashboard, rien à faire dans le SDK.
include = ["agentguard*", "policy*"]

[tool.ruff.lint]
ignore = [
    "BLE001",    # except Exception assumé : fallback fail-open documenté (audit, judges)
    "S110",      # try/except/pass : fallbacks de lecture (GENESIS), silencieux voulus
    "S112",      # try/except/continue : pattern acceptable dans certains cas
    "RUF012",    # Mutable class attributes avec annotations de type
    "EXE001",    # shebangs de tools/ : appelés via `python tools/...` dans le CI
    # Contrat public : les validateurs (policy/loader.py, benchmarks, alerts)
    # lèvent ValueError ; les appelants et les tests l'attendent. Pydantic
    # lève aussi des ValueError (ValidationError en hérite).
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Scripts utilitaires (hors package) : sorties console et appels système voulus
"scripts/*" = ["T201", "S603", "S607"]